import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinCompile

plugins {
    id 'java-gradle-plugin'
    alias(libs.plugins.starter.library.kotlin)
    alias(libs.plugins.osacky.doctor)
}

dependencies {
    implementation libs.publishplugin.gradle
    implementation libs.jetbrains.dokka
    compileOnly libs.jetbrains.kotlin.jvm.implementation
    compileOnly libs.jetbrains.kotlin.samwithreceiver
    compileOnly libs.usefulness.ktlint
}

kotlin {
    jvmToolchain(libs.versions.java.compilation.get().toInteger())
}

gradlePlugin {
    plugins {
        publishingPlugin {
            id = 'com.starter.publishing'
            implementationClass = 'PublishingPlugin'
        }
        conventionsPlugin {
            id = 'com.starter.conventions'
            implementationClass = 'ConventionsPlugin'
        }
    }
}
